<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14">
  <!-- US flag: red and white stripes, blue canton -->
  <!-- White background -->
  <rect width="20" height="14" fill="#fff"/>
  <!-- Red stripes (7 red stripes, each ~1.077 high) -->
  <rect y="0" width="20" height="1.077" fill="#B22234"/>
  <rect y="2.154" width="20" height="1.077" fill="#B22234"/>
  <rect y="4.308" width="20" height="1.077" fill="#B22234"/>
  <rect y="6.462" width="20" height="1.077" fill="#B22234"/>
  <rect y="8.615" width="20" height="1.077" fill="#B22234"/>
  <rect y="10.769" width="20" height="1.077" fill="#B22234"/>
  <rect y="12.923" width="20" height="1.077" fill="#B22234"/>
  <!-- Blue canton -->
  <rect width="8" height="7.538" fill="#3C3B6E"/>
  <!-- Stars (simplified as dots) -->
  <circle cx="1.5" cy="1.2" r="0.4" fill="#fff"/>
  <circle cx="3.5" cy="1.2" r="0.4" fill="#fff"/>
  <circle cx="5.5" cy="1.2" r="0.4" fill="#fff"/>
  <circle cx="7" cy="1.2" r="0.4" fill="#fff"/>
  <circle cx="2.5" cy="2.8" r="0.4" fill="#fff"/>
  <circle cx="4.5" cy="2.8" r="0.4" fill="#fff"/>
  <circle cx="6.5" cy="2.8" r="0.4" fill="#fff"/>
  <circle cx="1.5" cy="4.4" r="0.4" fill="#fff"/>
  <circle cx="3.5" cy="4.4" r="0.4" fill="#fff"/>
  <circle cx="5.5" cy="4.4" r="0.4" fill="#fff"/>
  <circle cx="7" cy="4.4" r="0.4" fill="#fff"/>
  <circle cx="2.5" cy="6" r="0.4" fill="#fff"/>
  <circle cx="4.5" cy="6" r="0.4" fill="#fff"/>
  <circle cx="6.5" cy="6" r="0.4" fill="#fff"/>
</svg>
