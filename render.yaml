services:
  - type: web
    name: tedhc-market
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TCG_ENV
        value: production
      - key: TCG_JWT_SECRET
        generateValue: true
      - key: TCG_LIGA_DISABLED
        value: "1"
      - key: TCG_DATABASE_URL
        value: "sqlite:////data/tcg_market.db"
      - key: TCG_API_KEY
        sync: false
      - key: TCG_CORS_ORIGINS
        sync: false
      - key: TCG_SCHEDULER_DISABLED
        value: "0"
      - key: TCG_ERROR_LOG_DIR
        value: /data/logs/errors
    disk:
      name: tcg-data
      mountPath: /data
      sizeGB: 1
