<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Arcane Signet - LigaMagic</title>
</head>
<body>
<div id="main-content">
  <h1>Arcane Signet</h1>
  <div class="container-edition">
    <select class="js-select-edition select2-hidden-accessible">
      <option value="1">Marketplace</option>
      <option value="480612_1">Foundations Commander <span class="year-edition">(2024)</span> <span class="sigla-edition">fdc</span></option>
      <option value="480263_367">Commander Masters <span class="year-edition">(2023)</span> <span class="sigla-edition">cmm</span></option>

    </select>

  <div class="container-show-price-mkp">

    <span class="cursor-pointer" onclick="mpcard.modal('full-average-price');">Ver Mais</span>
  </div>
  <div class="bg-light-gray container-price-mkp">
    <div class="container-extras">
      <div class="extras extras_n">N</div>

    <div class="price-mkp">

  </div>
  <!-- Marketplace listings (should NOT be picked up by parser) -->

    <div class="item">
      <div class="price">R$ 248,00</div>
      <div class="bids"><span>0 lances</span></div>

  </div>
</div>

</html>
